name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    # game-ci/unity-test-runner 在测试结束后会把结果发布为 GitHub Check Run。
    # 本仓库 GITHUB_TOKEN 的默认权限为只读，因此即使 186 个测试全数通过，
    # 该 step 仍会在发布阶段以下述错误失败、把门禁染红：
    #   Resource not accessible by integration
    #   https://docs.github.com/rest/checks/runs#create-a-check-run
    # 显式声明 checks: write 以放行结果发布；contents: read 为 checkout 所需。
    permissions:
      contents: read
      checks: write

    steps:
      # Unity CI 编辑器镜像（il2cpp 变体）体积达数 GB，ubuntu-latest 默认磁盘会被
      # docker pull 写满并以 exit code 125 (no space left on device) 失败。
      # 先清理预装的 Android SDK / .NET / GHC / large-packages 等，释放 ~20-30GB。
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # .claude/docs/technical-preferences.md 对 Hot Reload 的约定：
      # 「仅限开发期 Editor 使用 … CI 构建和 Player 构建中完全忽略此插件。」
      #
      # 该包的 9 个托管程序集按 Asset Store 授权未纳入版本控制，因此在全新检出中
      # 它的 144 个 .cs 找不到 SingularityGroup.HotReload.DTO / .Newtonsoft /
      # .RuntimeDependencies 等命名空间，产生 408 个 CS0246/CS0234，
      # 导致 Unity 以 "Scripts have compiler errors" 中止、测试一次都跑不到。
      #
      # 按上述既定政策移除该开发期工具，而不是把它的二进制提交进仓库 ——
      # 质量门禁不应依赖一个开发期加速工具能否编译。
      # 置于 Cache Library 之前，使缓存键如实反映实际参与编译的文件树。
      - name: Remove Editor-only Dev Tooling (Hot Reload)
        run: |
          rm -rf "Packages/com.singularitygroup.hotreload"
          rm -rf "Assets/HotReload"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 个人版授权激活需要三件套：.ulf 内容 + 账号邮箱 + 密码。
      # 只传 UNITY_LICENSE 会在激活阶段失败（Unity 无法校验该 .ulf 归属哪个账号）。
      - name: Run Edit Mode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          testMode: editmode
          artifactsPath: test-results/editmode

      - name: Run Play Mode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.19f1
          testMode: playmode
          artifactsPath: test-results/playmode

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
