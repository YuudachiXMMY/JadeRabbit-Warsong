#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: latency_calibration_offset_ms
    status: active
    source: design/gdd/so-data-layer.md   # PlayerInfoSO.latencyCalibrationOffsetMs 由 F4 定义
    referenced_by:
      - design/gdd/so-data-layer.md
      - design/gdd/audio-beat-clock.md    # F2 以 latency_offset_ms 名称消费此值，范围须一致
      - design/gdd/save-persistence.md    # F5 LatencyCalibrationDTO.latencyOffsetMs [-200.0, 200.0]；F5 第 330 行已核验一致
    value_range: [-200, 200]
    unit: ms
    notes: "F4 PlayerInfoSO 字段；F2 BeatClock 通过 F5 存档读取后注入。三文件（F4/F2/F5）范围均已校验一致。"
    added: 2026-07-14
    revised: "2026-07-15"

  - name: weapon_base_damage
    status: active
    source: design/gdd/so-data-layer.md   # WeaponSO.baseDamage 由 F4 定义
    referenced_by:
      - design/gdd/so-data-layer.md
      - design/gdd/combo-system.md          # C2 final_damage 公式的 base_damage 变量来源
    value_range: [1.0, 100.0]
    unit: damage_units
    notes: "WeaponSO.baseDamage；C2 final_damage 公式的 base_damage 变量来源。MVP 苗刀参考值 25.0。"
    added: 2026-07-14
    revised: ""

  - name: enemy_attack_windup_beats
    status: active
    source: design/gdd/so-data-layer.md   # EnemyInfoSO.attackWindupBeats 由 F4 定义
    referenced_by:
      - design/gdd/so-data-layer.md
      - design/gdd/combat-director.md      # C4 令牌授予后读取 W=attackWindupBeats 计算 targetLandingBeat（F-5）
    value_range: [0.5, 8.0]              # 旧值 [1, 4]；2026-07-14 F4 GDD 修订后更新（0.5 拍支持 Elite/Boss 极限压迫感）
    unit: beats
    notes: "EnemyInfoSO.attackWindupBeats；C4 战斗导演的 Beat-Locked 令牌分配使用此值判断敌人攻击前摇拍数。\
      schema 最大范围 [0.5, 8.0]；MVP 阶段普通敌人设计范围 [1.0, 4.0]（见 F4 Tuning Knobs）。"
    added: 2026-07-14
    revised: "2026-07-14"

  - name: bpm_range
    status: active
    source: design/gdd/audio-beat-clock.md   # BPM 范围由 F2 BeatClock 定义（硬限）
    referenced_by:
      - design/gdd/audio-beat-clock.md
      - design/gdd/so-data-layer.md          # F4 LevelConfigSO.bpm 字段范围与此对齐
      - design/gdd/tde-integration.md        # F6 attackAnimSpeed 公式的 currentBPM 输入范围
    value_range: [80, 240]
    unit: bpm
    notes: "F2 BeatClock 的 BPM clamp 硬限制。F4 LevelConfigSO.bpm 字段的 Odin [MinValue(80)][MaxValue(240)] 与此同步。F6 攻击动画速度公式的正常输入范围。"
    added: 2026-07-14
    revised: "2026-07-18"

  - name: nominal_attack_bpm
    status: active
    source: design/gdd/tde-integration.md   # 攻击动画制作参照 BPM 默认值，由 F6 定义
    referenced_by:
      - design/gdd/tde-integration.md
    value: 120                              # was: described as global F6Constants.NOMINAL_BPM before 2026-07-19
    unit: bpm
    notes: "攻击 Clip 的制作参照 BPM 默认值，由 AttackNodeSO.AuthoredBpm 字段 per-node 配置（默认 120f，范围 [60, 240]）。\
      F6-FORMULA-01 分母为 authoredBpm（非全局常量）：attackAnimSpeed = clamp(currentBPM / authoredBpm, SPEED_MIN, SPEED_MAX)。\
      不同连招节点可各自设定制作参照 BPM；若更改默认值须同步更新所有未自定义 AuthoredBpm 的攻击 Clip。\
      ADR-D5 引入 per-node 字段（tde-integration.md R3 修订，2026-07-19）。"
    added: 2026-07-18
    revised: "2026-07-19"

  - name: perk_rarity_roll_weights
    status: active
    source: design/gdd/perk-system.md      # C3 PerkRollService 加权抽取权重，C3 拥有最终数字
    referenced_by:
      - design/gdd/perk-system.md
      - design/gdd/so-data-layer.md         # F4 只定义 PerkRarity 枚举，Tuning 给参考权重；C3 锁定最终值
    value: "Common:60, Uncommon:30, Rare:8, Legendary:2"
    unit: weight
    notes: "PerkRollService 稀有度加权无放回抽取（三选一）的权重。F4 Tuning 给参考 60/30/8/2；C3 GDD 公式 4 锁定为最终值。\
      MVP 池仅 5 心法时 ~75% 抽到 Common，池扩过 MVP 后建议 lean 复检。"
    added: 2026-08-10
    revised: ""

  - name: combo_max
    status: active
    source: design/gdd/combo-system.md      # ComboMax 由 C2 F3 定义
    referenced_by:
      - design/gdd/combo-system.md
      - design/gdd/rhythm-core.md            # C1 拥有 CurrentCombo 段数计数；须将 clamp 由 50 抬至 999（下游债务，见 C2 Open Questions OQ1）
    value: 999
    unit: combo_count
    notes: "连招段数上限 = combo_multiplier 定义域上界 = HUD 连击天花板。跨系统债务：C1 rhythm-core 当前将 \
      CurrentCombo clamp 在 50，须同步抬至 999，否则 combo_multiplier 运行时被截到 ×2.09 而非设计的 ×5.0。\
      C1 文档修订为 follow-up（本次仅登记 registry）。"
    added: 2026-08-10
    revised: ""

