    rule: "统一 run-end 边界（ADR-D13，落地方式 a）：死亡与胜利/通关均须经 F6 TDELifecycleAdapter 单一入口 EndRun(RunOutcome) 停时钟，广播单一域事件 OnRunEnded(outcome)（取代原 OnPlayerDeath，不保留别名）。禁止：① 胜利路径跳过 BeatClock.Stop()（→ global_beat_index 不归零 + 下一局 double-Play() + C4 绝对拍令牌孤儿）；② 死亡/胜利各自复制一套清理逻辑而不复用单一边界；③ 绕过 EndRun 的一次性闭锁 _runEnded 直呼三步（多触发源下重复广播/二次 Stop）。RunOutcome 为 CombatCore 可见纯 C# enum，负载不含任何 TDE 类型。"
    rationale: "胜利与死亡同 class 终结一局（game-concept.md:164）；无对称边界会留下与 SG-2/SG-3 同源的 double-Play() 与令牌孤儿状态转换风险（W-F，cross-review 2026-08-12）。单一入口 + 闭锁保证'恰一次 OnRunEnded/单次 Stop'（TD 会签条件 C1）。"
