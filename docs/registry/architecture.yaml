# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: audio_middleware
    status: active
    api: "FMOD Studio 2.x via FMODUnity RuntimeManager package"
    not: "Unity AudioSource / AudioSettings.dspTime as rhythm-critical audio middleware"
    adr: docs/architecture/adr-d6-audio-middleware.md
    reason: "FMOD getDSPClock() provides sample-level precision (~0.02ms @ 48kHz) vs Unity Native buffer-boundary quantization (23-46ms on Android). Satisfies F2's <0.1ms timestamp accuracy requirement with 5x margin."
    referenced_by:
      - docs/architecture/adr-d6-audio-middleware.md
      - design/gdd/audio-beat-clock.md
    added: 2026-07-14
    revised: ""

  - purpose: bgm_dsp_scheduling
    status: active
    api: "FMOD.Channel.setDelay(startDSPClock, 0, false) with absolute system DSP clock"
    not: "FMOD.Studio.EventInstance for BGM; FMOD.Channel.setPosition(FMOD.TIMEUNIT.DSP)"
    adr: docs/architecture/adr-d6-audio-middleware.md
    reason: "EventInstance has no sample-accurate scheduling API; setPosition(DSP) is deprecated. setDelay() with system getDSPClock() is the only FMOD mechanism for sample-accurate scheduled playback."
    referenced_by:
      - docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14
    revised: ""

  - purpose: tde_input_manager_strategy
    status: active
    api: "JadeRabbitInputManager : InputSystemManagerEventsBased (subclass override)"
    not: "Removing InputSystemManagerEventsBased entirely from character prefabs"
    adr: docs/architecture/adr-d1-tde-integration.md
    reason: "Removing InputSystemManagerEventsBased breaks TDE AbilityInputAuthorization. Subclassing preserves the authorization pipeline while redirecting Action Map control to F3 InputEventBus."
    referenced_by:
      - docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15
    revised: ""

  - purpose: ai_beat_state_injection
    status: active
    api: "Unity Behavior Blackboard (BlackboardVariable<T>) written by BeatClockBridge.HandleBeatSnapshot() via BehaviorGraphAgent.SetVariableValue<T>()"
    not: "AI Action nodes reading BeatClock directly; AI nodes subscribing to BeatStateSnapshot events themselves"
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    reason: "beatclock_lifecycle_bypass forbidden pattern and beat_clock_lifecycle state ownership (TDELifecycleAdapter) prohibit AI from coupling directly to BeatClock. BeatClockBridge is the single Blackboard writer, decoupling all AI Action nodes from the rhythm subsystem."
    referenced_by:
      - docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18
    revised: "2026-07-18"  # ADR-D2 revised: BD SharedVariable/BehaviorTree → Unity Behavior BlackboardVariable<T>/BehaviorGraphAgent

  - purpose: enemy_movement_api
    status: active
    api: "CharacterMovement.SetMovement(Vector2) — TDE CharacterAbility layer"
    not: "TopDownController.SetMovement(Vector3) called directly from Unity Behavior Action nodes with a Vector2 argument"
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    reason: "TopDownController.SetMovement() takes Vector3; Vector2→Vector3 implicit conversion sets z=0, which in TopDownController2D's z→y remapping causes y-axis movement to always be 0 (up/down movement broken in 2D). CharacterMovement.SetMovement(Vector2) handles 2D/3D coordinate mapping internally and is the correct public API for Unity Behavior Action nodes to use. Verified: CharacterMovement.cs line 200."
    referenced_by:
      - docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18
    revised: "2026-07-18"  # ADR-D2 revised: "BD Action Tasks" → "Unity Behavior Action nodes"

  - purpose: animation_attack_pipeline
    status: active
    api: "HybridAnimancerComponent (Animancer 8.4.0) with state-level Speed scaling for BPM adaptation"
    not: "AnimancerComponent (lacks KeepChildrenConnected); AnimatorOverrideController (per-BPM clip variants); raw Animator state machine for attack layer"
    adr: docs/architecture/adr-d5-animation-pipeline.md
    reason: "HybridAnimancerComponent is Animancer 8.4.0's first-class API for coexisting with an existing Animator Controller (TDE locomotion). It sets KeepChildrenConnected=true on the PlayableGraph, preventing AnimatorControllerPlayable disconnection. Plain AnimancerComponent triggers OptionalWarning.NativeControllerHumanoid and does not set KeepChildrenConnected."
    referenced_by:
      - docs/architecture/adr-d5-animation-pipeline.md
      - docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-18
    revised: ""

  - purpose: enemy_ai_framework
    status: active
    api: "com.unity.behavior v1.0.16 (Unity Behavior Package) — BehaviorGraphAgent component replaces TDE AIBrain on all enemy prefabs"
    not: "Behavior Designer (Opsive BehaviorTree); TDE AIBrain/AIAction/AIDecision on enemies; custom C# behavior tree"
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    reason: "M0 Spike (2026-07-18) PASS — 0 BLOCKERs, 2 warnings in Unity 6.3 LTS. First-party Unity package: no additional vendor dependency vs Behavior Designer. API-equivalent: BehaviorGraphAgent replaces BehaviorTree, BlackboardVariable<T> replaces SharedVariable<T>, EventChannel<T> provides native event bus, RunSubgraphDynamic supports Boss phase transitions. Custom BT ruled out: redundant effort given Unity Behavior is available at zero cost."
    referenced_by:
      - docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18
    revised: ""

  - purpose: rhythm_evaluation_trigger
    status: active
    api: "Beat-anchored + pre-beat buffer evaluation: store input in _pendingInput on OnAttackInput; evaluate in OnHalfBeatLookahead (100ms before beat) or in OnAttackInput when _lateWindowActive (post-beat late window)"
    not: "Input-anchored immediate evaluation: evaluating beat_offset against BeatStateSnapshot.nearest_half_beat at the moment input arrives"
    adr: docs/architecture/adr-d3-rhythm-quantization-core.md
    reason: "Input-anchored evaluation snaps pre-beat inputs to the previous half-beat, producing a large positive OffsetMs that falsely reads as late. Beat-anchored evaluation holds the pending input until the correct beat reference (OnHalfBeatLookahead) is known, giving the correct signed offset."
    referenced_by:
      - docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-18
    revised: ""

  - purpose: so_data_container
    status: active
    api: "Unity ScriptableObjects + Addressables + Odin Editor Validation — 7 concrete SO types: AttackNodeSO, ComboGraphSO, PerkSO, WeaponSO, EnemyInfoSO, LevelConfigSO, PlayerInfoSO"
    not: "Runtime JSON/CSV external files; Unity DOTS BlobAssets"
    adr: docs/architecture/adr-d4-so-data-layer.md
    reason: "ScriptableObjects integrate natively with Unity Inspector (Odin UX) and Addressables (async loading). JSON/CSV lacks type safety and Inspector integration; DOTS BlobAssets are incompatible with TopDownEngine (MonoBehaviour-based)."
    referenced_by:
      - docs/architecture/adr-d4-so-data-layer.md
    added: 2026-07-19
    revised: ""

  - purpose: so_large_asset_reference
    status: active
    api: "AssetReferenceT<T> (Addressables lazy reference) for AnimationClip and Sprite fields in SO classes"
    not: "Direct AnimationClip or Sprite field references in ScriptableObject classes"
    adr: docs/architecture/adr-d4-so-data-layer.md
    reason: "Direct references cause implicit full-bundle pulls when the parent SO loads from Addressables (a single ComboGraphSO load can implicitly pull 20 AnimationClips). AssetReferenceT<T> defers loading to the owning system (C2 for clips, C3 for icons). Exception: List<AttackNodeSO> in ComboGraphSO retains direct refs (small metadata SOs co-bundled per Rule D4-6)."
    referenced_by:
      - docs/architecture/adr-d4-so-data-layer.md
      - docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-19
    revised: ""

  - purpose: perk_clone_strategy
    status: active
    api: "Instantiate(originalPerkSO) — C3 clones PerkSO assets before a run, modifies clones during the run, destroys clones at run end"
    not: "Modifying PerkSO asset fields directly at runtime; using ScriptableObject.CreateInstance<PerkSO>() as a clone substitute"
    adr: docs/architecture/adr-d4-so-data-layer.md
    reason: "All SOs are read-only at runtime (Rule D4-1). PerkSO is the sole exception because C3 needs to track per-run stack counts and parameter overrides. Instantiate() deep-copies all serialized fields (including List<PerkParameter> where PerkParameter is a [Serializable] struct). C3 owns the clone lifecycle."
    referenced_by:
      - docs/architecture/adr-d4-so-data-layer.md
    added: 2026-07-19
    revised: ""

  - purpose: dsp_clock_canonical_method
    status: active
    api: "IDSPClock.GetDspTime() — the single canonical method name for reading FMOD DSP time (seconds) across F2/F3/C4"
    not: "GetCurrentTime() (F2/ADR-D6 legacy); GetCurrentDSPTime() (historical). All three call sites must converge on GetDspTime()."
    adr: docs/architecture/adr-d8-di-test-seams.md
    reason: "Three docs diverged on the DSP-clock method name (F2 GetCurrentTime, historical GetCurrentDSPTime, F3 GetDspTime — cross-review W2/W-06). ADR-D8 owns the IDSPClock interface declaration and canonicalizes GetDspTime() (clearest semantics; already used by F3 input-timestamp injection). ADR-D6 FMODDSPClockImpl + audio-beat-clock.md must rename to GetDspTime() in the naming-sync revision."
    referenced_by:
      - docs/architecture/adr-d8-di-test-seams.md
      - docs/architecture/adr-d6-audio-middleware.md
      - design/gdd/audio-beat-clock.md
      - design/gdd/input-event-system.md
    added: 2026-08-11
    revised: ""

