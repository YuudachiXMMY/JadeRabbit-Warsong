# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: fmod_eventinstance_bgm_scheduling
    status: active
    description: "Do not use FMOD.Studio.EventInstance to play or schedule rhythm-critical BGM. Use FMOD Core API (FMOD.Sound + FMOD.Channel.setDelay()) instead."
    why: "EventInstance.start() fires on the next FMOD update tick, not at a specified DSP clock. This introduces 5-20ms scheduling jitter that invalidates BeatClock's DSP start anchor."
    adr: docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14

  - pattern: unity_samplerate_in_fmod_dsp_clock
    status: active
    description: "Do not use AudioSettings.outputSampleRate as the divisor when converting FMOD DSP clock (ulong samples) to seconds. Always call coreSystem.getSoftwareFormat(out int sampleRate, ...) and use FMOD's own sample rate."
    why: "FMOD and Unity Audio initialize as independent audio systems and may run at different sample rates. Using AudioSettings.outputSampleRate as the divisor produces a DSP clock that silently drifts from wall clock time, corrupting all beat timestamps."
    adr: docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14

  - pattern: direct_action_map_enable_disable
    status: active
    description: "Do not call InputActionMap.Enable() or InputActionMap.Disable() from any code outside F3 InputEventBus or JadeRabbitInputManager. All Action Map state changes must go through F3's public API (EnableGameplayInput / EnableUIInput / DisableAllInput)."
    why: "F3's _isSwitchingMaps guard must wrap every gameplayMap.Disable() call to prevent ghost LightAttack events from charged input interruptions (E3 edge case). Direct calls bypass this guard."
    adr: docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15

  - pattern: beatclock_lifecycle_bypass
    status: active
    description: "Do not call BeatClock.Play() / Stop() / Pause() / Resume() from any system other than TDELifecycleAdapter (F6). Other systems may only read BeatClock state via BeatStateSnapshot or subscribe to C# beat events."
    why: "Split lifecycle control causes audio-rhythm desync. TDELifecycleAdapter coordinates BeatClock and InputEventBus atomically in the same frame; bypassing it breaks this coordination."
    adr: docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15

  - pattern: tde_aibrain_on_bd_enemies
    status: active
    description: "Enemy prefabs that use Behavior Designer BehaviorTree as the AI controller must NOT include TDE AIBrain, AIAction, or AIDecision components. The two AI systems must not coexist on the same enemy character."
    why: "TDE AIAction and AIDecision components depend on AIBrain.PerformActions() loop to execute. If AIBrain is absent, these components are inert — they produce no behavior but add confusion and potential initialization errors. BD BehaviorTree is the sole high-level AI driver on enemies; mixing both systems creates split authority over AI behavior."
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18

  - pattern: animancer_stop_for_controller_handoff
    status: active
    description: "Do not call HybridAnimancerComponent.Stop() to return control to TDE's Animator Controller. Use PlayController() instead."
    why: "Stop() calls _Graph.Stop() which pauses the entire PlayableGraph — including TDE's AnimatorControllerPlayable. This freezes locomotion and death animations. PlayController() correctly fades back to the Animator Controller layer without stopping the graph."
    adr: docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-18

  - pattern: animancer_layer_speed_for_bpm
    status: active
    description: "Do not modify the Animancer layer's Speed property for BPM scaling. BPM adaptation must use AnimancerState.Speed on the individual attack state only."
    why: "Layer Speed affects all states on that layer, including transition blending. If a future slow-motion system also sets layer Speed, the two multipliers stack unpredictably. State-level Speed is local to the attack clip and composes cleanly: state.Speed = currentBpm / authoredBpm."
    adr: docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-18

