# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: beat-clock
    status: active
    budget_ms: 0.2
    platform: All
    adr: docs/architecture/adr-d6-audio-middleware.md
    notes: "Includes FMOD RuntimeManager.Update() (~0.05ms) + BeatClock.Update() DSP clock read (~0.01ms) + event dispatch overhead. Main thread only."
    referenced_by:
      - docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14
    revised: ""

