# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: tde_to_f3_action_map_bridge
    status: active
    pattern: method_call
    producer: f6-jade-rabbit-input-manager
    consumers:
      - f3-input-event-bus
    adr: docs/architecture/adr-d1-tde-integration.md
    signal_signature: "JadeRabbitInputManager overrides InputSystemManagerEventsBased Action Map Enable/Disable → delegates to InputEventBus.EnableGameplayInput() / EnableUIInput() / DisableAllInput()"
    referenced_by:
      - docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15
    revised: ""

  - contract: f6_to_f2_lifecycle_control
    status: active
    pattern: method_call
    producer: f6-tde-lifecycle-adapter
    consumers:
      - f2-beat-clock
    adr: docs/architecture/adr-d1-tde-integration.md
    signal_signature: "TDELifecycleAdapter exclusively calls BeatClock.Play(bgmRef, bpm, timeSig) / Stop() / Pause() / Resume() in response to TDE lifecycle events (scene load, pause, death, respawn)"
    referenced_by:
      - docs/architecture/adr-d1-tde-integration.md
      - docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-15
    revised: ""

  - contract: combat_director_attack_token
    status: active
    pattern: direct_call
    producer: fe1-enemy-ai (CombatDirectorTokenAction Unity Behavior Action)
    consumers:
      - c4-combat-director
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    signal_signature: "CombatDirectorTokenAction calls CombatDirector.RequestAttackToken(enemy) and blocks (returns Status.Running) until OnTokenGranted() callback or TimeoutBeats elapses. No enemy attack CharacterAbility fires without a token grant."
    referenced_by:
      - docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18
    revised: "2026-07-18"  # ADR-D2 revised: BD CombatDirectorTokenTask → Unity Behavior CombatDirectorTokenAction

  - contract: rhythm_judgment_event
    status: active
    pattern: event_bus
    producer: c1-rhythm-judger
    consumers:
      - c2-combo-graph       # reads Rating + ComboCountBefore to advance combo state
      - p1-hud               # reads Rating + OffsetMs to display judgment UI
      - pl2-vfx-feedback     # reads Rating to trigger Perfect/Good/Miss MMFeedbacks sequence
    adr: docs/architecture/adr-d3-rhythm-quantization-core.md
    signal_signature: "RhythmJudger.OnRhythmJudgment (C# event Action<RhythmJudgmentEvent>); payload: readonly struct RhythmJudgmentEvent { AttackType, Rating, OffsetMs, BeatDspTime, Mode, ComboCountBefore }"
    referenced_by:
      - docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-18
    revised: ""

  - contract: animationclip_load_contract
    status: active
    pattern: direct_call
    producer: c2-combo-graph-system
    consumers:
      - f6-animancer-attack-player  # receives loaded AnimationClip, passes to AnimancerAttackPlayer.Play()
    adr: docs/architecture/adr-d4-so-data-layer.md
    signal_signature: "C2 calls AttackNodeSO.animationClip.LoadAssetAsync<AnimationClip>() during room load for all nodes in the active ComboGraphSO; stores handles; releases via Addressables.Release(handle) on room exit. Clip is passed to AnimancerAttackPlayer.Play(loadedClip) per ADR-D5."
    referenced_by:
      - docs/architecture/adr-d4-so-data-layer.md
      - docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-19
    revised: ""

  - contract: easysave_so_boundary
    status: active
    pattern: shared_resource
    producer: f5-save-system
    consumers:
      - fe5-meta-progression  # extracts DTO from PlayerInfoSO and passes to F5
    adr: docs/architecture/adr-d4-so-data-layer.md
    signal_signature: "F5 serializes PlayerProgressDTO (extracted from PlayerInfoSO) — never PlayerInfoSO directly. Pattern: PlayerInfoSO → extract 3 fields (playerMerit→merit, unlockedWeaponIds, metaUpgradeLevels) → ES3.Save('progress', dto). [NonSerialized] fields (latencyCalibrationOffsetMs, audioVolumeMaster) are in separate DTOs per ADR-D7."
    referenced_by:
      - docs/architecture/adr-d4-so-data-layer.md
      - docs/architecture/adr-d7-save-persistence-middleware.md
    added: 2026-07-19
    revised: ""

