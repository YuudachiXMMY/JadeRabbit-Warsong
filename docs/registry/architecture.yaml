# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: f2_self_load_latency_from_f5
    status: active
    description: "BeatClock (F2) must NOT call SaveService.LoadLatencyCalibration() or otherwise self-load LatencyOffsetMs from F5. The boot value is injected once by the F6 TDELifecycleAdapter startup coordinator; runtime updates come only from the FE3 calibration flow. BeatClock is a pure injected holder, never a loader."
    why: "A self-load in BeatClock.Start() created a second, un-owned writer of LatencyOffsetMs that Rule 10's single-writer invariant did not cover, and a hidden runtime dependency of F2 on F5. ADR-D10 D-5 centralizes the boot-load on the F6 gate so BeatClock has no F5 dependency and the runtime invariant (FE3-only) holds."
    adr: docs/architecture/adr-d10-bootstrap-sequencing.md
    added: 2026-08-08

  - pattern: fmod_eventinstance_bgm_scheduling
    status: active
    description: "Do not use FMOD.Studio.EventInstance to play or schedule rhythm-critical BGM. Use FMOD Core API (FMOD.Sound + FMOD.Channel.setDelay()) instead."
    why: "EventInstance.start() fires on the next FMOD update tick, not at a specified DSP clock. This introduces 5-20ms scheduling jitter that invalidates BeatClock's DSP start anchor."
    adr: docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14

  - pattern: unity_samplerate_in_fmod_dsp_clock
    status: active
    description: "Do not use AudioSettings.outputSampleRate as the divisor when converting FMOD DSP clock (ulong samples) to seconds. Always call coreSystem.getSoftwareFormat(out int sampleRate, ...) and use FMOD's own sample rate."
    why: "FMOD and Unity Audio initialize as independent audio systems and may run at different sample rates. Using AudioSettings.outputSampleRate as the divisor produces a DSP clock that silently drifts from wall clock time, corrupting all beat timestamps."
    adr: docs/architecture/adr-d6-audio-middleware.md
    added: 2026-07-14

  - pattern: direct_action_map_enable_disable
    status: active
    description: "Do not call InputActionMap.Enable() or InputActionMap.Disable() from any code outside F3 InputEventBus or JadeRabbitInputManager. All Action Map state changes must go through F3's public API (EnableGameplayInput / EnableUIInput / DisableAllInput)."
    why: "F3's _isSwitchingMaps guard must wrap every gameplayMap.Disable() call to prevent ghost LightAttack events from charged input interruptions (E3 edge case). Direct calls bypass this guard."
    adr: docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15

  - pattern: beatclock_lifecycle_bypass
    status: active
    description: "Do not call BeatClock.Play() / Stop() / Pause() / Resume() from any system other than TDELifecycleAdapter (F6). Other systems may only read BeatClock state via BeatStateSnapshot or subscribe to C# beat events."
    why: "Split lifecycle control causes audio-rhythm desync. TDELifecycleAdapter coordinates BeatClock and InputEventBus atomically in the same frame; bypassing it breaks this coordination."
    adr: docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15

  - pattern: tde_aibrain_on_bd_enemies
    status: active
    description: "Enemy prefabs that use Unity Behavior BehaviorGraphAgent as the AI controller must NOT include TDE AIBrain, AIAction, or AIDecision components. The two AI systems must not coexist on the same enemy character."
    why: "TDE AIAction and AIDecision components depend on AIBrain.PerformActions() loop to execute. If AIBrain is absent, these components are inert — they produce no behavior but add confusion and potential initialization errors. BehaviorGraphAgent is the sole high-level AI driver on enemies; mixing both systems creates split authority over AI behavior."
    adr: docs/architecture/adr-d2-enemy-ai-framework.md
    added: 2026-07-18
    revised: "2026-07-18"  # ADR-D2 revised: "Behavior Designer BehaviorTree" → "Unity Behavior BehaviorGraphAgent"

  - pattern: animancer_stop_for_controller_handoff
    status: active
    description: "Do not call HybridAnimancerComponent.Stop() to return control to TDE's Animator Controller. Use PlayController() instead."
    why: "Stop() calls _Graph.Stop() which pauses the entire PlayableGraph — including TDE's AnimatorControllerPlayable. This freezes locomotion and death animations. PlayController() correctly fades back to the Animator Controller layer without stopping the graph."
    adr: docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-18

  - pattern: animancer_layer_speed_for_bpm
    status: active
    description: "Do not modify the Animancer layer's Speed property for BPM scaling. BPM adaptation must use AnimancerState.Speed on the individual attack state only."
    why: "Layer Speed affects all states on that layer, including transition blending. If a future slow-motion system also sets layer Speed, the two multipliers stack unpredictably. State-level Speed is local to the attack clip and composes cleanly: state.Speed = currentBpm / authoredBpm."
    adr: docs/architecture/adr-d5-animation-pipeline.md
    added: 2026-07-18

  - pattern: direct_beat_offset_at_input_time
    status: active
    description: "Do not evaluate beat_offset_ms using BeatStateSnapshot.nearest_half_beat or any BeatClock snapshot query at the moment input arrives. All offset calculation must occur in TryEvaluateEarly() / TryEvaluateLate(), using _currentBeatDspTime set by OnHalfBeatLookahead."
    why: "Evaluating offset at input time introduces two errors: (1) pre-beat inputs reference the previous half-beat, producing a falsely large positive offset; (2) BeatStateSnapshot.nearest_half_beat interpolates from system time, not FMOD DSP clock, introducing the very latency error that F3's beat_offset_ms formula is designed to remove."
    adr: docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-18

  - pattern: resources_load_for_so
    status: active
    description: "Do not use Resources.Load() to load any F4 SO asset (AttackNodeSO, ComboGraphSO, PerkSO, WeaponSO, EnemyInfoSO, LevelConfigSO, PlayerInfoSO). All SO assets must be loaded via Addressables.LoadAssetAsync<T>()."
    why: "Resources/ causes all assets in the folder to be included in every build regardless of whether they are used. Addressables provides on-demand loading, bundle-level memory control, and enables remote content delivery. AC-F4-09 enforces this via CI scan."
    adr: docs/architecture/adr-d4-so-data-layer.md
    added: 2026-07-19

  - pattern: easysave_direct_so_serialization
    status: active
    description: "Do not call ES3.Save(key, playerInfoSO) or any EasySave 3 serialization API with a ScriptableObject instance as the value. F5 must extract a plain DTO struct first, then serialize the DTO."
    why: "EasySave 3 cannot reliably serialize UnityEngine.Object subclasses (it may serialize the GUID reference rather than the field values). Directly serializing PlayerInfoSO also captures [NonSerialized] fields' default values (0 / 1.0) and loses the correct DTO schema versioning from ADR-D7."
    adr: docs/architecture/adr-d4-so-data-layer.md
    added: 2026-07-19

  - pattern: perkparameter_ref_type_fields
    status: active
    description: "Do not add C# reference type fields (class instances, arrays of objects, interface references, AnimationCurve, etc.) to the PerkParameter [Serializable] struct. All PerkParameter fields must be value types or string."
    why: "Unity's Instantiate(scriptableObject) deep-copies serialized data but shallow-copies non-serialized reference-type fields. A reference-type field in PerkParameter would cause the PerkSO clone and the original asset to share the same object reference — mutations to the clone's parameter would silently corrupt the original asset (the exact bug Rule D4-1 exists to prevent)."
    adr: docs/architecture/adr-d4-so-data-layer.md
    added: 2026-07-19

  - pattern: parallel_pause_resume_event_source
    status: active
    description: "Do not define per-system OnGamePaused / OnGameResumed (or any parallel pause/resume event) in C1/C2/C3/C4/F6. F2 BeatClock is the SOLE publisher of the canonical OnBeatClockPaused / OnBeatClockResumed (payload BeatClockPauseEventData); subscribers are C1/C3/F6. C4 may subscribe to the same events if needed later — without introducing a new source."
    why: "BC-6: three systems previously diverged on pause/resume signal sources, breaking coordinated pause handling (C1 grid re-anchor, C3 modifier freeze, F6 audio-degrade recovery). A single F2-published source with a pair invariant (AC-F2-28: exactly one Paused before its paired Resumed) is the only way subscribers stay coherent. F6 TDELifecycleAdapter initiates via IBeatClockLifecycle.Pause()/Resume(); F2 publishes the events."
    adr: docs/architecture/adr-d8-di-test-seams.md
    added: 2026-08-11

  - pattern: lifecycle_methods_in_beatclock_consumer_seam
    status: active
    description: "The IBeatClock consumer-seam interface (ADR-D8) MUST NOT declare Play/Stop/Pause/Resume/RequestBPMChange/RequestTimeSignatureChange. Those belong to IBeatClockLifecycle (ADR-D1, F6-only). Consumers (C1/C4) inject IBeatClock and get read/subscribe access only; they cannot reach lifecycle control through the injected type."
    why: "Compile-time enforcement of beatclock_lifecycle_bypass. If IBeatClock exposed lifecycle methods, an injected consumer could call Pause() directly, splitting lifecycle control away from F6 TDELifecycleAdapter and desyncing audio/rhythm. Interface segregation (read face vs control face) turns the doc-level ban into a compile-time unreachable path."
    adr: docs/architecture/adr-d8-di-test-seams.md
    added: 2026-08-11

