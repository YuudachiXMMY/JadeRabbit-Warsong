# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-08-11"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: action_map_state
    status: active
    owner_system: f3-input-event-bus
    adr: docs/architecture/adr-d1-tde-integration.md
    interface: "InputEventBus.EnableGameplayInput() / EnableUIInput() / DisableAllInput() — exclusive method calls; JadeRabbitInputManager delegates TDE lifecycle changes through these methods"
    write_access: f3-input-event-bus-only
    referenced_by:
      - docs/architecture/adr-d1-tde-integration.md
    added: 2026-07-15
    revised: ""

  - state: beat_clock_lifecycle
    status: active
    owner_system: f2-beat-clock
    adr: docs/architecture/adr-d1-tde-integration.md
    interface: "BeatClock.Play() / Stop() / Pause() / Resume() — exclusive lifecycle control by TDELifecycleAdapter (F6); other systems may only read state via BeatStateSnapshot"
    write_access: f6-tde-lifecycle-adapter-only
    referenced_by:
      - docs/architecture/adr-d1-tde-integration.md
      - docs/architecture/adr-d6-audio-middleware.md
      - docs/architecture/adr-d5-animation-pipeline.md
      - docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-15
    revised: ""

  - state: rhythm_judgment_combo
    status: active
    owner_system: c1-rhythm-judger
    adr: docs/architecture/adr-d3-rhythm-quantization-core.md
    interface: "RhythmJudger.CurrentCombo (read-only int property); reset on Miss or death; incremented on Perfect/Good"
    write_access: c1-rhythm-judger-only
    referenced_by:
      - docs/architecture/adr-d3-rhythm-quantization-core.md
    added: 2026-07-18
    revised: ""

  - state: latency_offset_ms
    status: active
    owner_system: fe3-latency-calibration
    adr: docs/architecture/adr-d10-bootstrap-sequencing.md
    interface: "BeatClock.LatencyOffsetMs (float ms, range [-200,200]). Two-phase writer (ADR-D10 D-5): BOOT = f6-tde-lifecycle-adapter injects once from F5 LatencyCalibrationDTO before BeatClock.Play() and EnableGameplayInput(); RUNTIME = fe3-latency-calibration is the sole writer. Both writers execute on the Unity MAIN THREAD (ADR-D6 Threading Addendum, 2026-08-08, item 6) — no synchronization primitive required. Persisted by F5 (global/calibration.es3); source field so-data-layer latencyCalibrationOffsetMs."
    write_access: boot-f6-tde-lifecycle-adapter-once__runtime-fe3-latency-calibration-only
    fe3_forward_stance: "FE3 (Latency Calibration System) GDD, when authored, MUST honour two prospective stances flowing from ADR-D10 D-5 + ADR-D6 Addendum: (1) SOLE RUNTIME WRITER of BeatClock.LatencyOffsetMs (boot-inject is F6-only, once); (2) MAIN-THREAD INJECTION — all runtime writes occur on the Unity main thread, coherent with main-thread beat dispatch. /architecture-review flags any FE3 GDD violating either."
    referenced_by:
      - docs/architecture/adr-d10-bootstrap-sequencing.md
      - docs/architecture/adr-d6-audio-middleware.md
      - design/gdd/audio-beat-clock.md
      - design/gdd/save-persistence.md
      - design/gdd/tde-integration.md
    added: 2026-08-08
    revised: 2026-08-09
    revised: ""

